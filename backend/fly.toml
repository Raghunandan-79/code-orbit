app = "syncraft-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[env]
  ALLOWED_ORIGINS = "*"
  MAX_ROOMS = "500"
  MAX_PARTICIPANTS_PER_ROOM = "25"
  ROOM_IDLE_EXPIRATION = "24h"
